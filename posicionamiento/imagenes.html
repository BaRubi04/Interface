<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagenes.css">
    <title>Posicionamiento imágenes</title>
</head>
<body style="position:absolute; background-color: azure;">
    <header style="background-color: bisque;">
        <h2>Esto es el header</h2>
    </header>
    <main>
        <img src="./imagenes/gato.jpeg" style="position:relative; width: 500px;float:left; left:0px; top: 200px; z-index: 2;">
        <img src="./imagenes/panda.jpeg" style="position:relative; width: 200px;float:left; left:-100px; top: 0px; z-index: 1;">
        <img src="./imagenes/panda2.webp" style="position:relative; width: 400px;float:left; left:-150px; top: 250px;">
        <img src="./imagenes/suku.png" style="position:relative; width: 300px;float:left;">
    </main>
    
    <footer style="background-color: rgb(100, 80, 54);">
        <h2>Esto es el footer</h2>
    </footer>
</body>
</html>
