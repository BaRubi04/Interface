<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .primario{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            margin: 50px;
            display: inline-block;
            position:relative;
        }
        div>p{
            margin: 0;
            background-color: grey;
        }
        p{
            text-align: center;
        }
        #caja1{
            position: static;
            width: 100%;
            margin-top: 30px;
            background-color: aquamarine;
        }
        #caja2{
            position: relative;
            width: 100%;
            height: 100%;
            top: 30px;
            background-color: rgba(255, 228, 196, 0.761);
        }
        #caja3{
            position: absolute;
            width: 100%;
            height: 100%;
            top: 30px;
            background-color: rgba(168, 38, 38, 0.708);
        }
    </style>
</head>
<body>
    <div class="primario">
        <div id="caja1">
            .
        </div>
        <div>
            <p>textito</p>
        </div>
    </div>
    <div class="primario">
        <div id="caja2">

        </div>
        <div>
            <p>textito</p>
        </div>
    </div>
    <div class="primario">
        <div id="caja3">

        </div>
        <div>
            <p>textito</p>
        </div>
    </div>
    <div style="position:relative; background-color: black; top: 400px; left: 400px; width: 700px; height: 700px;">
        <div style="position:relative; background-color: rgba(255, 0, 0, 0.721); bottom: 50px; right: 129px; width: 200px; height: 200px;">
            
        </div>
    </div>
</body>
</html>
